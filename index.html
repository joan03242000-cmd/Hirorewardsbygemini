<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <!-- 注音轉換函式庫 -->

  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: var(--font-family);
      touch-action: manipulation;
    }
    /* 注音直書排版樣式 */
    .zc {
      display: inline-flex;
      align-items: center;
      vertical-align: baseline;
      margin: 0 0.05em;
      position: relative;
    }
    .zp {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      font-size: 0.44em;
      line-height: 1;
      margin-left: 0.12em;
      font-weight: 600;
      color: #1d4ed8;
      opacity: 0.95;
      user-select: none;
    }
    .zp.n {
      flex-direction: column;
    }
    .zp i {
      font-style: normal;
      font-size: 0.9em;
    }
    .zs {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: -0.05em;
    }
    .zy-line {
      line-height: 1.85 !important;
    }
    /* 動畫效果 */
    @keyframes starPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12) rotate(4deg); }
    }
    .star-pulse {
      animation: starPulse 2.5s infinite ease-in-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-amber-50/70 text-slate-800 min-h-screen pb-16 antialiased selection:bg-amber-200">

  <div id="app" class="max-w-4xl mx-auto px-4 py-4 md:py-6"></div>

  <!-- 浮動提示 Toast -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-6 py-3 rounded-full text-base font-bold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2 flex items-center gap-2">
    <span id="toast-text"></span>

  <!-- 家長驗證 PIN 彈窗 -->
  <div id="pin-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border-4 border-amber-300 pop-in text-center">

      <input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••" 
             class="w-full text-center text-3xl tracking-widest font-black py-3 border-2 border-slate-300 rounded-2xl mb-4 focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-200 bg-slate-50">

          <p>點擊右上角「三個點選單 ⋮」，選擇<strong>「加到主螢幕」</strong>或<strong>「安裝應用程式」</strong>即可。</p>
        </div>

<script type="module">
// ==================== 1. Firebase 雲端即時同步模組 ====================
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// 環境變數解析
const appId = typeof __app_id !== 'undefined' ? __app_id : 'kid-stars-wonderland';
let db = null;
let auth = null;
let isCloudReady = false;
let unsubscribeFirestore = null;
let currentFamilyCode = localStorage.getItem('star_family_code') || '';
let syncStatus = 'local'; // 'local', 'connecting', 'connected', 'error'

// 初始化音效合成器 (Web Audio API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  try {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'star') {
      // 歡樂高音星星音效
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'redeem') {
      // 成功慶祝音效
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554.37, now + 0.1);
      osc.frequency.setValueAtTime(659.25, now + 0.2);
      osc.frequency.setValueAtTime(880, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    }
  } catch (e) {
    // 忽略自動播放限制錯誤
  }
}

// 嘗試載入 Firebase
try {
  if (typeof __firebase_config !== 'undefined') {
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);

    // 匿名或 Custom Token 認證
    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
      await signInWithCustomToken(auth, __initial_auth_token);
    } else {
      await signInAnonymously(auth);
    }
    isCloudReady = true;
  }
} catch (e) {
  console.warn("未提供 Firebase Config 或連線本地端，將使用 LocalStorage 運行", e);
}

// ==================== 2. 資料結構與狀態管理 ====================
const STORAGE_KEY = 'kid_star_rewards_cloud';

function getDefaultData() {
  return {
    name: '小寶貝',
    pin: '1234',
    points: 10,
    zy: true,
    lastUpdated: Date.now(),
    tasks: [
      { id: 1, ic: '🧹', n: '整理房間與玩具', p: 5 },
      { id: 2, ic: '🪥', n: '自己刷牙洗臉', p: 2 },
      { id: 3, ic: '📚', n: '認真完成功課', p: 5 },
      { id: 4, ic: '🥦', n: '把蔬菜吃光光', p: 3 },
      { id: 5, ic: '🧺', n: '主動幫忙家事', p: 3 },
      { id: 6, ic: '💤', n: '準時上床睡覺', p: 4 }
    ],
    rewards: [
      { id: 11, ic: '📺', n: '看30分鐘卡通動畫', p: 15 },
      { id: 12, ic: '🍪', n: '挑選一份美味點心', p: 20 },
      { id: 13, ic: '🎮', n: '玩平板遊戲20分鐘', p: 25 },
      { id: 14, ic: '🎡', n: '選週末好玩的行程', p: 50 },
      { id: 15, ic: '🧸', n: '買一個心願新玩具', p: 80 }
    ],
    log: [
      { t: '小星星樂園啟動！初始獎勵', d: new Date().toLocaleDateString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) }
    ]
  };
}

let S = null;
try {
  const local = localStorage.getItem(STORAGE_KEY);
  if (local) S = JSON.parse(local);
} catch (e) {}
if (!S || !Array.isArray(S.tasks)) {
  S = getDefaultData();
}

let currentMode = 'kid';
let parentTab = 'award';
let pendingRedeemId = null;

// 儲存邏輯 (LocalStorage + 雲端同步)
async function persistState(shouldBroadcast = true) {
  try {
    S.lastUpdated = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch (e) {}

  if (shouldBroadcast && isCloudReady && currentFamilyCode && db) {
    try {
      syncStatus = 'connecting';
      // 遵循 RULE 1 規範路徑
      const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', `family_${currentFamilyCode.trim().toUpperCase()}`);
      await setDoc(roomDocRef, S);
      syncStatus = 'connected';
    } catch (err) {
      console.error("同步到雲端失敗", err);
      syncStatus = 'error';
    }
  }
}

// 監聽雲端資料變更（手機操作 -> 平板即時收到）
function setupCloudListener() {
  if (unsubscribeFirestore) {
    unsubscribeFirestore();
    unsubscribeFirestore = null;
  }

  if (!isCloudReady || !currentFamilyCode || !db) {
    syncStatus = 'local';
    render();
    return;
  }

  syncStatus = 'connecting';
  render();

  const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', `family_${currentFamilyCode.trim().toUpperCase()}`);
  
  unsubscribeFirestore = onSnapshot(roomDocRef, (snap) => {
    syncStatus = 'connected';
    if (snap.exists()) {
      const remoteData = snap.data();
      if (remoteData && Array.isArray(remoteData.tasks)) {
        // 如果遠端星星變多，發出星光音效提示兒童
        if (remoteData.points > S.points) {
          playSound('star');
          showToast(`獲得小星星！目前共 ${remoteData.points} 顆 ⭐`, '✨');
        }
        S = remoteData;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
        
        // 若使用者正在輸入 input 則避免強制重繪失焦
        const active = document.activeElement;
        if (!active || active.tagName !== 'INPUT') {
          render();
        }
      }
    } else {
      // 房間若不存在，將本地資料初始化上傳
      setDoc(roomDocRef, S);
    }
    render();
  }, (error) => {
    console.error("即時同步連線失敗:", error);
    syncStatus = 'error';
    render();
  });
}

// ==================== 3. 注音核心模組 ====================
const ZI = {
  b:'ㄅ', p:'ㄆ', m:'ㄇ', f:'ㄈ', d:'ㄉ', t:'ㄊ', n:'ㄋ', l:'ㄌ',
  g:'ㄍ', k:'ㄎ', h:'ㄏ', j:'ㄐ', q:'ㄑ', x:'ㄒ', zh:'ㄓ', ch:'ㄔ',
  sh:'ㄕ', r:'ㄖ', z:'ㄗ', c:'ㄘ', s:'ㄙ'
};
const FM = {
  a:'ㄚ', o:'ㄛ', e:'ㄜ', ai:'ㄞ', ei:'ㄟ', ao:'ㄠ', ou:'ㄡ', an:'ㄢ',
  en:'ㄣ', ang:'ㄤ', eng:'ㄥ', er:'ㄦ', i:'ㄧ', ia:'ㄧㄚ', io:'ㄧㄛ',
  ie:'ㄧㄝ', iao:'ㄧㄠ', iu:'ㄧㄡ', iou:'ㄧㄡ', ian:'ㄧㄢ', in:'ㄧㄣ',
  iang:'ㄧㄤ', ing:'ㄧㄥ', iong:'ㄩㄥ', u:'ㄨ', ua:'ㄨㄚ', uo:'ㄨㄛ',
  uai:'ㄨㄞ', ui:'ㄨㄟ', uei:'ㄨㄟ', uan:'ㄨㄢ', un:'ㄨㄣ', uen:'ㄨㄣ',
  uang:'ㄨㄤ', ueng:'ㄨㄥ', ong:'ㄨㄥ', v:'ㄩ', ve:'ㄩㄝ', van:'ㄩㄢ', vn:'ㄩㄣ'
};
const TM = { '1':'', '2':'ˊ', '3':'ˇ', '4':'ˋ' };

function pinyinToZhuyin(p) {
  const m = /^([a-zü]+)([1-5])?$/.exec(p || '');
  if (!m) return '';
  let s = m[1].replace('ü', 'v');
  let t = m[2] || '5';
  let i = '', f = '', r = '';

  if (s === 'er') f = 'er';
  else if (s[0] === 'y') {
    r = s.slice(1);
    f = r[0] === 'i' ? r : (r[0] === 'u' ? 'v' + r.slice(1) : 'i' + r);
  } else if (s[0] === 'w') {
    r = s.slice(1);
    f = r[0] === 'u' ? r : 'u' + r;
  } else {
    const l = s.slice(0, 2);
    if (l === 'zh' || l === 'ch' || l === 'sh') i = l;
    else if (ZI[s[0]]) i = s[0];
    f = s.slice(i.length);
    if (i && 'jqx'.indexOf(i) >= 0 && f[0] === 'u') f = 'v' + f.slice(1);
    if (f === 'i' && ['zh', 'ch', 'sh', 'r', 'z', 'c', 's'].indexOf(i) >= 0) f = '';
  }

  const b = (ZI[i] || '') + (f === '' ? '' : (FM[f] || ''));
  if (!b) return '';
  return t === '5' ? '˙' + b : b + TM[t];
}

function makeZhuyinChar(char, zhuyin) {
  const isNeutral = zhuyin[0] === '˙';
  let tone = '';
  let mainZhuyin = zhuyin;

  if (isNeutral) {
    mainZhuyin = mainZhuyin.slice(1);
  } else if ('ˊˇˋ'.indexOf(mainZhuyin.slice(-1)) >= 0) {
    tone = mainZhuyin.slice(-1);
    mainZhuyin = mainZhuyin.slice(0, -1);
  }

  return `<span class="zc"><span>${char}</span><span class="zp ${isNeutral ? 'n' : ''}">${isNeutral ? '<i>˙</i>' : ''}<span class="zs">${mainZhuyin}</span>${tone ? '<i>' + tone + '</i>' : ''}</span></span>`;
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

function Z(text) {
  text = String(text || '');
  if (currentMode !== 'kid' || S.zy === false || !window.pinyinPro) {
    return escapeHtml(text);
  }

  return text.split(/([\u4e00-\u9fff]+)/).map((seg, idx) => {
    if (idx % 2 === 0) return escapeHtml(seg);
    let pinyinList = [];
    try {
      pinyinList = pinyinPro.pinyin(seg, { toneType: 'num', type: 'array', v: true });
    } catch (e) {
      return escapeHtml(seg);
    }
    return seg.split('').map((ch, j) => {
      const z = pinyinToZhuyin(pinyinList[j]);
      return z ? makeZhuyinChar(ch, z) : ch;
    }).join('');
  }).join('');
}

// 輔助函式
function addLog(actionText) {
  const dateStr = new Date().toLocaleDateString('zh-TW', {
    month: 'numeric',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
  S.log.unshift({ t: actionText, d: dateStr });
  if (S.log.length > 50) S.log = S.log.slice(0, 50);
}

let toastTimeout;
function showToast(text, icon = '✨') {
  const toast = document.getElementById('toast');
  const tText = document.getElementById('toast-text');
  tText.textContent = `${icon} ${text}`;
  toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
  toast.classList.add('opacity-100', 'translate-y-0');
  
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('opacity-100', 'translate-y-0');
    toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
  }, 2200);
}

// ==================== 4. 畫面渲染 UI ====================
function render() {
  const app = document.getElementById('app');
  let html = '';

  // 雲端同步狀態標籤
  let syncBadge = '';
  if (syncStatus === 'connected') {
    syncBadge = `<button onclick="openSyncModal()" class="text-xs font-black bg-emerald-100 text-emerald-800 px-2.5 py-1.5 rounded-xl border border-emerald-300 flex items-center gap-1 active:scale-95"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端同步：${currentFamilyCode}</button>`;
  } else if (syncStatus === 'connecting') {
    syncBadge = `<button onclick="openSyncModal()" class="text-xs font-black bg-yellow-100 text-yellow-800 px-2.5 py-1.5 rounded-xl border border-yellow-300 flex items-center gap-1 active:scale-95"><span class="w-2 h-2 rounded-full bg-yellow-500 animate-spin"></span> 連線中...</button>`;
  } else {
    syncBadge = `<button onclick="openSyncModal()" class="text-xs font-black bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1.5 rounded-xl border border-slate-300 flex items-center gap-1 active:scale-95"><span>☁️</span> 啟用多機同步</button>`;
  }

  // 頂部導航列
  html += `
    <header class="flex items-center justify-between gap-2 mb-4">
      <div class="flex items-center gap-2">
        <span class="text-3xl star-pulse inline-block">⭐</span>
        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-amber-950">${Z('小星星獎勵樂園')}</h1>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        ${syncBadge}

// ==================== 5. 互動事件綁定 ====================

window.handleKidRedeem = function(id) {
  const reward = S.rewards.find(r => r.id === id);
  if (!reward) return;

  if (pendingRedeemId === id) {
    if (S.points >= reward.p) {
      S.points -= reward.p;
      addLog(`兌換「${reward.n}」扣除 ${reward.p} 顆星`);
      persistState(true);
      pendingRedeemId = null;
      playSound('redeem');
      showToast(`兌換成功！已獲得 ${reward.n}`, '🎉');
      render();
    }
  } else {
    pendingRedeemId = id;
    playSound('star');
    showToast('請再按一次確認以完成兌換！', '🔔');
    render();
  }
};

window.parentAwardTask = function(id) {
  const task = S.tasks.find(t => t.id === id);
  if (!task) return;
  S.points += task.p;
  addLog(`完成【${task.n}】+${task.p} ⭐`);
  persistState(true);
  playSound('star');
  showToast(`已發送 +${task.p} 顆星星！`, '⭐');
  render();
};

window.adjustPoints = function(diff) {
  S.points = Math.max(0, S.points + diff);
  addLog(`手動調整點數：${diff > 0 ? '+' + diff : diff} ⭐`);
  persistState(true);
  playSound('star');
  showToast(`目前星星：${S.points}`, '⭐');
  render();
};

window.switchParentTab = function(tab) {
  parentTab = tab;
  render();
};

window.updateSetting = function(field, val) {
  if (field === 'points') {
    S.points = Math.max(0, parseInt(val, 10) || 0);
  } else if (field === 'zy') {
    S.zy = !!val;
  } else {
    S[field] = String(val).trim();
  }
  persistState(true);
  render();
};

window.clearHistoryLog = function() {
  S.log = [];
  persistState(true);
  showToast('已清空歷史紀錄', '🧹');
  render();
};

window.addItem = function(type) {
  const isTask = type === 't';
  const newItem = {
    id: Date.now(),
    ic: isTask ? '🌟' : '🎁',
    n: isTask ? '新好習慣任務' : '新願望獎勵',
    p: isTask ? 3 : 20
  };
  if (isTask) S.tasks.push(newItem);
  else S.rewards.push(newItem);
  persistState(true);
  render();
};

window.deleteListItem = function(type, id) {
  if (type === 't') S.tasks = S.tasks.filter(t => t.id !== id);
  else S.rewards = S.rewards.filter(r => r.id !== id);
  persistState(true);
  render();
};

window.updateListItem = function(type, id, field, value) {
  const list = type === 't' ? S.tasks : S.rewards;
  const target = list.find(x => x.id === id);
  if (!target) return;

  if (field === 'p') {
    target.p = Math.max(1, parseInt(value, 10) || 1);
  } else {
    target[field] = String(value).trim();
  }
  persistState(true);
};

// ==================== 6. 家庭代碼設定彈窗 ====================
window.openSyncModal = function() {
  const input = document.getElementById('room-code-input');
  input.value = currentFamilyCode;
  document.getElementById('sync-modal').classList.remove('hidden');
};

window.closeSyncModal = function() {
  document.getElementById('sync-modal').classList.add('hidden');
};

window.generateRandomRoomCode = function() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let result = 'STAR';
  for (let i = 0; i < 4; i++) {
    result += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('room-code-input').value = result;
};

window.saveAndConnectRoom = function() {
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (!code) {
    showToast('請輸入家庭代碼', '⚠️');
    return;
  }
  currentFamilyCode = code;
  localStorage.setItem('star_family_code', code);
  closeSyncModal();
  setupCloudListener();
  persistState(true);
  showToast(`已設定同步代碼：${code}`, '☁️');
};

window.disconnectRoom = function() {
  currentFamilyCode = '';
  localStorage.removeItem('star_family_code');
  if (unsubscribeFirestore) {
    unsubscribeFirestore();
    unsubscribeFirestore = null;
  }
  syncStatus = 'local';
  closeSyncModal();
  showToast('已切換為本機單機模式', '📴');
  render();
};

// ==================== 7. 家長 PIN 與安全管理 ====================
window.switchMode = function(mode) {
  currentMode = mode;
  pendingRedeemId = null;
  render();
};

window.promptParentPin = function() {
  const modal = document.getElementById('pin-modal');
  const input = document.getElementById('pin-input');
  input.value = '';
  modal.classList.remove('hidden');
  input.focus();
};

document.getElementById('pin-cancel-btn').addEventListener('click', () => {
  document.getElementById('pin-modal').classList.add('hidden');
});

function checkPinAndEnter() {
  const input = document.getElementById('pin-input');
  const enteredPin = input.value.trim();
  const currentPin = S.pin || '1234';

  if (enteredPin === currentPin) {
    document.getElementById('pin-modal').classList.add('hidden');
    switchMode('parent');
    showToast('歡迎家長進入管理模式！', '🔓');
  } else {
    showToast('PIN 密碼不正確', '⚠️');
    input.value = '';
    input.focus();
  }
}

document.getElementById('pin-confirm-btn').addEventListener('click', checkPinAndEnter);
document.getElementById('pin-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkPinAndEnter();
});

// PWA 指引彈窗
window.openPwaModal = function() {
  document.getElementById('pwa-modal').classList.remove('hidden');
};
window.closePwaModal = function() {
  document.getElementById('pwa-modal').classList.add('hidden');
};

// 初始化啟動
window.onload = function() {
  setupCloudListener();
  render();
};
</script>
</body>
</html>
